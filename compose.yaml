services:
  connector:
    build: .
    environment:
      SOURCE_URL: http://simulator:8001/events
      SPLUNK_HEC_URL: http://simulator:8001/services/collector/event
      CONNECTOR_DB: /app/data/connector.sqlite3
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - connector-data:/app/data
    depends_on:
      simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
  simulator:
    build: .
    command: ["python", "-m", "uvicorn", "sentinelbridge.simulator:app", "--host", "0.0.0.0", "--port", "8001", "--no-access-log"]
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  connector-data:
